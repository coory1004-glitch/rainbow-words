<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="5살 아이를 위한 영어 단어 게임. 게임으로 별을 모아 공주를 꾸며요.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rainbow Words">
<meta name="theme-color" content="#ffe0f1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px)}
body{margin:0; font:14px/1.4 system-ui, sans-serif}
img{max-width:100%}
[hidden]{display:none !important}
</style>
<title>Rainbow Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Jua&display=swap">
<style>
/* Layout: the dressed-up princess is the home base. Games fill one framed play field under a word bar; the closet pairs her stage with a shelf of things to buy. */
:root{
  --ink:#4a2b5e;
  --ink-soft:#86669a;
  --sun:#ffd23f;
  --mint:#34cf9c;
  --outline:#ffffff;
  --f-ko:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-en:"Comfortaa","Varela Round","Trebuchet MS",system-ui,sans-serif;
  --f-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;

  /* world tokens: home values here, each world overrides them on body[data-world] */
  --w-top:#ffe0f1; --w-bot:#e4dcff;
  --w-ink:#4a2b5e; --w-ink-soft:#7d5f92;
  --w-card:#ffffff; --w-edge:#f4b6d8; --w-shade:#de8fbd;
  --w-accent:#ff5fae; --w-accent-ink:#d63a87;
  --w-dot:rgba(255,255,255,.65); --w-seg:rgba(255,255,255,.75);
  --w-drop:rgba(74,43,94,.18);
  color-scheme:light;
}
body[data-world="unicorn"]{ --w-top:#ffd6ee; --w-bot:#e8d8ff; --w-edge:#ff9fd0; --w-shade:#e47db5; --w-accent:#ff5fae; --w-accent-ink:#d63a87; }
body[data-world="sweets"]{ --w-top:#fff0d8; --w-bot:#ffd6e4; --w-edge:#ffb98a; --w-shade:#e9966a; --w-accent:#ff6f86; --w-accent-ink:#d9475f; }
body[data-world="colors"]{ --w-top:#fff6c4; --w-bot:#d6efff; --w-edge:#b9a4ff; --w-shade:#9a82e8; --w-accent:#3f8cff; --w-accent-ink:#2a6fdc; }
body[data-world="cars"]{ --w-top:#c6ebff; --w-bot:#e4fae2; --w-edge:#7cc0ff; --w-shade:#5a9fe3; --w-accent:#2f86ff; --w-accent-ink:#1f6ad6; }
body[data-world="halloween"]{ --w-top:#24133f; --w-bot:#56307f; --w-ink:#fff1de; --w-ink-soft:#dcc6f4; --w-card:#fff6ea; --w-edge:#ff9a3c; --w-shade:#c4661a; --w-accent:#ff8a1f; --w-accent-ink:#cf5a00; --w-dot:rgba(255,236,190,.32); --w-seg:rgba(255,255,255,.2); --w-drop:rgba(0,0,0,.35); }

*{box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--f-ko);
  color:var(--w-ink);
  background:
    radial-gradient(var(--w-dot) 2px, transparent 2.8px) 0 0/44px 44px,
    radial-gradient(var(--w-dot) 1.4px, transparent 2px) 22px 22px/44px 44px,
    linear-gradient(170deg, var(--w-top), var(--w-bot)) fixed;
  background-color:var(--w-top);
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none; user-select:none;
  touch-action:manipulation;
}
#app{
  min-height:100%;
  display:flex; flex-direction:column;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.screen{
  flex:1; width:100%; max-width:980px; margin-inline:auto;
  display:flex; flex-direction:column;
  padding-block:14px 26px;
  gap:clamp(12px, 2.2vh, 20px);
}
.emoji{font-family:var(--f-emoji); font-weight:400; line-height:1}
button{font:inherit; color:inherit; background:none; border:0; padding:0; margin:0; cursor:pointer}
button:focus-visible{outline:4px solid var(--w-accent); outline-offset:4px}

/* the squishy toy surface shared by every tappable thing */
.toy{
  --face:var(--w-card); --edge:var(--w-edge); --shade:var(--w-shade);
  background:var(--face);
  border:4px solid var(--edge);
  box-shadow:0 8px 0 var(--shade), 0 16px 26px var(--w-drop);
  transition:transform .12s ease, box-shadow .12s ease, opacity .3s ease;
}
.toy:active{transform:translateY(6px); box-shadow:0 2px 0 var(--shade), 0 6px 12px var(--w-drop)}

/* ---------- rainbow letters ---------- */
.word{
  margin:0; max-width:100%;
  display:flex; flex-wrap:wrap; justify-content:center; column-gap:.32em;
  font-family:var(--f-en); font-weight:700; line-height:1.15;
}
.wgrp{display:inline-flex; white-space:nowrap}
.ltr{
  display:inline-block; color:var(--c);
  text-shadow:
    0 .05em 0 var(--outline), 0 -.05em 0 var(--outline), .05em 0 0 var(--outline), -.05em 0 0 var(--outline),
    .036em .036em 0 var(--outline), -.036em .036em 0 var(--outline), .036em -.036em 0 var(--outline), -.036em -.036em 0 var(--outline),
    0 .13em 0 var(--w-drop);
  animation:letterPop .55s cubic-bezier(.3,1.5,.5,1) var(--d, 0ms) both;
}
.ltr[data-act]{cursor:pointer}

/* ---------- shared bits ---------- */
.bar{display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:12px}
.bar h1{margin:0; text-align:center; font-size:clamp(22px, 6vw, 34px); font-weight:400; display:flex; align-items:center; justify-content:center; gap:8px}
.round{
  --face:#ffffff;
  width:58px; height:58px; border-radius:50%;
  border-width:3px;
  display:grid; place-items:center;
  color:var(--ink);
  box-shadow:0 6px 0 var(--shade), 0 10px 16px var(--w-drop);
}
.round:active{box-shadow:0 1px 0 var(--shade), 0 4px 8px var(--w-drop)}
.round svg{width:28px; height:28px}
.pill{
  display:flex; align-items:center; gap:6px;
  padding:8px 14px 8px 12px; border-radius:999px;
  background:#fff; border:3px solid var(--w-edge); color:var(--ink);
  font-size:22px; font-variant-numeric:tabular-nums; white-space:nowrap;
}
.pill .emoji{font-size:22px}
.rbar{display:flex; gap:5px; height:16px}
.rbar i{flex:1; border-radius:99px; background:var(--w-seg)}
.rbar i.on{background:var(--c)}
.rbar i.now{background:var(--c); animation:blink 1.1s ease-in-out infinite}
.cue{margin:0; font-size:clamp(16px, 4.2vw, 20px); color:var(--w-ink-soft); text-align:center}
.note{margin:0; text-align:center; font-size:14px; color:var(--w-ink-soft); line-height:1.5}
.sec{margin:4px 0 0; font-size:clamp(19px, 5vw, 24px); font-weight:400; text-align:center}
.btn{padding:14px 26px; border-radius:999px; font-size:clamp(19px, 5vw, 25px); color:var(--ink); white-space:nowrap}
.btn.primary{--face:#ff5fae; --edge:#ec4597; --shade:#bf3378; color:#fff}
.row{display:flex; flex-wrap:wrap; justify-content:center; gap:14px; padding-top:6px}
.mini{padding:8px 16px; border-radius:999px; background:rgba(255,255,255,.75); color:var(--ink); font-size:15px; white-space:nowrap}
.mini.danger{background:#ff4f64; color:#fff}

/* ---------- princess stage ---------- */
.stagebox{
  position:relative; width:100%; max-width:560px; margin-inline:auto;
  height:clamp(240px, 40vh, 400px);
  border-radius:36px; overflow:hidden;
  border:5px solid #fff;
  box-shadow:0 10px 0 rgba(74,43,94,.12), 0 18px 30px var(--w-drop);
  background:#ffe0f1;
}
.stagebox.small{height:clamp(190px, 28vh, 270px); max-width:440px}
.scene{position:absolute; inset:0; width:100%; height:100%; display:block}
.avatar{position:absolute; left:50%; bottom:1%; height:96%; aspect-ratio:2/3; width:auto; transform:translateX(-50%); display:block}
.stagebox .pet{position:absolute; right:9%; bottom:5%; font-size:clamp(44px, 9vh, 82px); animation:bob 2.4s ease-in-out infinite}
.dress-chip{
  --face:#ffffff; --edge:#ff9fd0; --shade:#e47db5;
  position:absolute; left:14px; bottom:18px;
  padding:9px 16px; border-radius:999px; border-width:3px;
  font-size:19px; color:var(--ink);
  display:flex; align-items:center; gap:6px;
  box-shadow:0 5px 0 var(--shade), 0 8px 14px rgba(74,43,94,.2);
}
.dress-chip .emoji{font-size:22px}

/* ---------- home ---------- */
.top{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.top-r{display:flex; align-items:center; gap:10px; margin-left:auto}
.round.sm{width:48px; height:48px}
.round.sm svg{width:24px; height:24px}
.logo{font-size:clamp(28px, 7.2vw, 54px); justify-content:flex-start}
.games{width:100%; max-width:760px; margin-inline:auto; display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:clamp(10px, 2.6vw, 20px); padding-bottom:6px}
.game{border-radius:30px; padding:14px 6px 12px; display:flex; flex-direction:column; align-items:center; gap:5px; color:var(--ink); text-align:center}
.game .gi{font-size:clamp(44px, 12vw, 72px); animation:bob 3s ease-in-out var(--d, 0s) infinite}
.gn{font-size:clamp(17px, 4.6vw, 23px); line-height:1.15}
.gs{font-size:13px; color:var(--ink-soft)}
.wide{
  --face:#ffffff; --edge:#c3a6ff; --shade:#a084e6;
  width:100%; max-width:760px; margin-inline:auto;
  border-radius:999px; padding:12px 20px;
  display:flex; align-items:center; justify-content:center; gap:10px;
  font-size:20px; color:var(--ink);
}
.wide .emoji{font-size:28px}
.wide small{font-size:15px; color:var(--ink-soft); font-variant-numeric:tabular-nums}

/* ---------- word worlds ---------- */
.worlds{width:100%; max-width:760px; margin-inline:auto; display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:clamp(14px, 3vw, 22px); padding-bottom:8px}
@media (min-width:720px){ .worlds{grid-template-columns:repeat(3, minmax(0,1fr))} }
.tile{border-radius:34px; padding:18px 10px 16px; display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--tile-ink, var(--ink)); text-align:center}
.tile.rainbow{
  border-color:transparent;
  background:
    linear-gradient(var(--face), var(--face)) padding-box,
    linear-gradient(100deg, #ff4f64, #ff9330, #ffd23f, #2fc27a, #3a86ff, #9a63ff, #ff5fae) border-box;
}
.tile .ic{font-size:clamp(54px, 13vw, 84px); animation:bob 3.2s ease-in-out var(--d, 0s) infinite}
.tile-ko{font-size:clamp(19px, 4.8vw, 25px); line-height:1.15}
.tile-en{font-family:var(--f-en); font-weight:700; font-size:12.5px; letter-spacing:.04em; opacity:.72}
.tile-prog{margin-top:2px; padding:4px 11px; border-radius:99px; background:var(--prog, rgba(255,255,255,.75)); font-size:15px; font-variant-numeric:tabular-nums; display:inline-flex; align-items:center; gap:4px}

/* ---------- word cards (intro) ---------- */
.stage{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(10px, 2.4vh, 22px); text-align:center}
.card{display:flex; flex-direction:column; align-items:center; gap:4px; border-radius:40px}
.wig{display:block; animation:cardIn .5s cubic-bezier(.3,1.4,.5,1) var(--d, 0ms) both}
.pic{display:block}
.pic.emoji{line-height:1.08}
svg.pic{width:1em; height:.92em}
.big{padding:clamp(14px, 3vh, 28px) clamp(24px, 6vw, 48px); border-radius:46px}
.big .pic{font-size:min(42vw, 28vh, 220px); animation:bob 2.6s ease-in-out infinite}
.ko{margin:-4px 0 0; font-size:clamp(22px, 5.6vw, 32px); color:var(--w-ink)}
.controls{display:flex; align-items:center; justify-content:center; gap:24px}
.next{--face:var(--mint); --edge:#22b585; --shade:#178e66; width:88px; height:88px; border-radius:50%; display:grid; place-items:center; color:#fff}
.next svg{width:46px; height:46px; animation:nudge 1.3s ease-in-out infinite}

/* ---------- game screen ---------- */
.play{gap:10px; padding-bottom:max(14px, env(safe-area-inset-bottom, 0px))}
.ask{
  --face:#ffffff;
  align-self:center; max-width:100%;
  display:flex; align-items:center; gap:12px;
  padding:8px 22px 8px 10px; border-radius:999px;
  color:var(--ink); text-align:left;
  box-shadow:0 6px 0 var(--shade), 0 12px 20px var(--w-drop);
}
.spk{flex:none; width:52px; height:52px; border-radius:50%; background:var(--w-accent); color:#fff; display:grid; place-items:center; animation:ring 1.6s ease-out infinite}
.spk svg{width:28px; height:28px}
.ask-t{display:flex; flex-direction:column; min-width:0}
.ask-t small{font-family:var(--f-en); font-weight:700; font-size:13px; color:var(--ink-soft); letter-spacing:.03em}
.ask-word{font-family:var(--f-en); font-weight:700; color:var(--w-accent-ink); line-height:1.15}
.field{
  position:relative; flex:1; min-height:300px;
  border-radius:30px; overflow:hidden;
  border:5px solid #fff;
  box-shadow:0 10px 0 rgba(74,43,94,.12), 0 18px 30px var(--w-drop);
  touch-action:none;
}
.field canvas{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:pointer}
.field-cue{
  position:absolute; left:50%; bottom:16px; transform:translateX(-50%);
  margin:0; padding:8px 16px; border-radius:999px;
  background:rgba(255,255,255,.9); color:var(--ink);
  font-size:17px; white-space:nowrap; pointer-events:none;
  animation:blink 1.6s ease-in-out infinite;
}

/* ---------- result ---------- */
.done{align-items:center; justify-content:center; text-align:center}
.done-ko{margin:0; font-size:clamp(21px, 5.4vw, 30px)}
.star-row{display:flex; flex-wrap:wrap; justify-content:center; gap:4px; font-size:clamp(28px, 7vw, 40px)}
.star-row span{animation:popIn .5s cubic-bezier(.3,1.5,.5,1) calc(var(--i) * 110ms + 300ms) both}
.goal{margin:0; padding:10px 18px; border-radius:20px; background:rgba(255,255,255,.75); color:var(--ink); font-size:clamp(16px, 4.2vw, 19px)}
.sub{margin:4px 0 0; font-size:18px; font-weight:400; color:var(--w-ink-soft)}
.learned{display:flex; flex-wrap:wrap; justify-content:center; gap:14px; max-width:640px}

/* ---------- stickers ---------- */
.sticker{
  width:104px; padding:10px 6px 9px; border-radius:24px; border-width:3px;
  display:flex; flex-direction:column; align-items:center; gap:5px;
  box-shadow:0 5px 0 var(--shade), 0 10px 16px var(--w-drop);
}
.sticker:active{box-shadow:0 1px 0 var(--shade), 0 4px 8px var(--w-drop)}
.sticker .pic{font-size:48px}
.sticker .w{font-family:var(--f-en); font-weight:700; font-size:13px; color:var(--ink); overflow-wrap:anywhere; text-align:center}
.locked-st{--face:rgba(255,255,255,.6); --edge:rgba(255,255,255,.9); --shade:rgba(74,43,94,.12)}
.locked-st .pic{filter:brightness(0) opacity(.15)}
.locked-st .w{color:var(--ink-soft)}
.shelf{background:rgba(255,255,255,.55); border-radius:30px; padding:14px 14px 20px; display:flex; flex-direction:column; gap:14px}
.shelf h2{margin:0; font-size:22px; font-weight:400; display:flex; align-items:center; gap:10px; color:var(--ink)}
.shelf h2 .emoji{font-size:30px}
.shelf h2 small{margin-left:auto; font-size:16px; color:var(--ink-soft); font-variant-numeric:tabular-nums}
.stickers{display:grid; grid-template-columns:repeat(auto-fill, minmax(92px, 1fr)); gap:14px}
.stickers .sticker{width:auto}
.reset{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center; font-size:15px; color:var(--w-ink-soft); padding-top:6px}

/* ---------- closet ---------- */
.closet-grid{display:grid; gap:18px; align-items:start}
@media (min-width:860px){
  .closet-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
  .closet-grid .stagebox{position:sticky; top:14px; height:min(70vh, 560px)}
}
.shop{display:flex; flex-direction:column; gap:14px; min-width:0}
.tabs{display:flex; gap:8px; overflow-x:auto; padding:4px 2px 8px; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:8px 12px 7px; border-radius:20px;
  background:rgba(255,255,255,.55); border:3px solid transparent;
  color:var(--ink); font-size:14px; white-space:nowrap;
}
.tab .emoji{font-size:28px}
.tab.on{background:#fff; border-color:var(--w-accent)}
.items{display:grid; grid-template-columns:repeat(auto-fill, minmax(98px, 1fr)); gap:16px 14px; padding-top:8px}
.item{position:relative; border-radius:24px; padding:8px 6px 10px; display:flex; flex-direction:column; align-items:center; gap:4px; border-width:3px; box-shadow:0 5px 0 var(--shade), 0 10px 16px var(--w-drop)}
.item:active{box-shadow:0 1px 0 var(--shade), 0 4px 8px var(--w-drop)}
.th{width:100%; aspect-ratio:1; display:grid; place-items:center; border-radius:16px; overflow:hidden}
.th svg{width:100%; height:100%; display:block}
.th .scene{position:static}
.th .emoji{font-size:54px}
.nm{font-family:var(--f-en); font-weight:700; font-size:12px; color:var(--ink); text-align:center; line-height:1.2}
.item.wearing{--face:#fff4fa; --edge:var(--w-accent); --shade:#d63a87}
.item.locked .th{opacity:.6; filter:saturate(.6)}
.item.can .th{opacity:1; filter:none}
.badge,.price{position:absolute; top:-10px; right:-6px; border-radius:99px; padding:2px 9px; font-size:14px; font-variant-numeric:tabular-nums}
.badge{background:var(--mint); color:#fff}
.price{background:#fff; border:2px solid var(--sun); color:var(--ink)}
.item.can .price{background:var(--sun); animation:wiggleIn 1.4s ease-in-out infinite}
.none-ic{width:66%; aspect-ratio:1; border-radius:50%; border:3px dashed rgba(74,43,94,.3); display:grid; place-items:center; font-size:16px; color:var(--ink-soft)}

/* ---------- effects ---------- */
#fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:40}
.fly{position:fixed; left:0; top:0; z-index:50; pointer-events:none; font-size:46px}
.toast{
  position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom, 0px)); z-index:60;
  transform:translateX(-50%); max-width:calc(100% - 32px);
  padding:12px 20px; border-radius:999px;
  background:#fff; color:var(--ink); border:3px solid var(--sun);
  box-shadow:0 10px 24px rgba(74,43,94,.25);
  font-family:var(--f-ko); font-size:18px; text-align:center;
  animation:toastIn .35s cubic-bezier(.3,1.5,.5,1) both;
}

@keyframes letterPop{0%{opacity:0; transform:translateY(40%) scale(.3)}100%{opacity:1; transform:none}}
@keyframes cardIn{0%{opacity:0; transform:scale(.55) translateY(12%)}100%{opacity:1; transform:none}}
@keyframes toastIn{0%{opacity:0; transform:translateX(-50%) scale(.5)}100%{opacity:1; transform:translateX(-50%)}}
@keyframes popIn{0%{opacity:0; transform:scale(.3)}70%{opacity:1; transform:scale(1.15)}100%{opacity:1; transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6%) rotate(2deg)}}
@keyframes nudge{0%,100%{transform:translateX(-3px)}50%{transform:translateX(6px)}}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--w-accent)}100%{box-shadow:0 0 0 16px rgba(255,255,255,0)}}
@keyframes blink{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes wiggleIn{0%,100%{transform:rotate(0)}10%{transform:rotate(-10deg)}20%{transform:rotate(8deg)}30%{transform:rotate(0)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition:none !important}
}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>

<script>
(() => {
const RAINBOW = ['#ff4f64','#ff9330','#f5b800','#2fc27a','#3a86ff','#9a63ff','#ff5fae'];
const PASTEL = ['#ff8fa3','#ffb36b','#ffe066','#7fe0a8','#7cb8ff','#b79bff','#ff9fd2'];
const TAU = Math.PI * 2;
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

/* ================= words ================= */
// [english, picture, korean] — colors use a hex instead of an emoji; two hexes make a metallic shine

/* ================= helpers ================= */
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const range = n => Array.from({length:n}, (_, i) => i);
const pickOne = a => a[Math.floor(Math.random() * a.length)];
function wordOf(wid, i){
  const W = byId[wid], [en, pic, ko] = W.words[i];
  return { en, pic, ko, color:!!W.color, key: wid + ':' + en };
}
function josa(s){ // 을/를
  const c = s.charCodeAt(s.length - 1);
  if (c < 0xAC00 || c > 0xD7A3) return '를';
  return (c - 0xAC00) % 28 ? '을' : '를';
}
function starD(cx, cy, R, r = R * .45){
  let d = '';
  for (let i = 0; i < 10; i++) { const rr = i % 2 ? r : R, a = i * Math.PI / 5 - Math.PI / 2; d += (i ? 'L' : 'M') + (cx + Math.cos(a) * rr).toFixed(1) + ' ' + (cy + Math.sin(a) * rr).toFixed(1); }
  return d + 'Z';
}
const HEART_D = 'M50 86C22 66 6 50 6 31 6 17 17 6 31 6c8 0 15 4 19 11 4-7 11-11 19-11 14 0 25 11 25 25 0 19-16 35-44 55z';
let UID = 0;
function pic(w, cls = ''){
  if (w.color) {
    const [c1, c2] = w.pic.split(','), gid = 'g' + (++UID);
    const defs = c2 ? `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset=".55" stop-color="${c2}"/><stop offset="1" stop-color="${c1}"/></linearGradient></defs>` : '';
    return `<svg class="pic ${cls}" viewBox="0 0 100 92" aria-hidden="true">${defs}<path d="${HEART_D}" fill="${c2 ? `url(#${gid})` : c1}" stroke="rgba(74,43,94,.32)" stroke-width="3"/><ellipse cx="29" cy="27" rx="10" ry="6" fill="#fff" opacity=".6" transform="rotate(-32 29 27)"/></svg>`;
  }
  return `<span class="pic emoji ${cls}" aria-hidden="true">${w.pic}</span>`;
}
function letters(text, tap = false){
  let k = 0;
  return text.split(' ').map(g => `<span class="wgrp">${[...g].map(ch => {
    const s = `style="--c:${RAINBOW[k % 7]};--d:${k * 65}ms"`; k++;
    return tap && /[a-z]/i.test(ch) ? `<span class="ltr" data-act="letter" data-l="${ch}" ${s}>${ch}</span>` : `<span class="ltr" ${s}>${ch}</span>`;
  }).join('')}</span>`).join('');
}
function wordSize(text){
  const L = Math.max(...text.split(' ').map(s => s.length));
  return `min(120px, ${(84 / (L * 0.7)).toFixed(2)}vw, 15vh)`;
}

const wait = ms => new Promise(r => setTimeout(r, ms));
const spriteBytes = {}, spriteBufs = {};
function fetchSprite(name){
  if (!spriteBytes[name]) spriteBytes[name] = fetch(`audio/${name}.mp3`)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .catch(() => { spriteBytes[name] = null; return null; });
  return spriteBytes[name];
}
function loadSprite(name){
  if (!spriteBufs[name]) spriteBufs[name] = fetchSprite(name).then(ab => new Promise(res => {
    const a = audio();
    if (!ab || !a) return res(null);
    try { const pr = a.decodeAudioData(ab.slice(0), res, () => res(null)); if (pr && pr.catch) pr.catch(() => res(null)); } catch (e) { res(null); }
  })).then(b => { if (!b) spriteBufs[name] = null; return b; });
  return spriteBufs[name];
}
const preload = names => names.forEach(n => fetchSprite(n));

// the device voice is only a fallback when a clip cannot load
const canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let voice = null;
function pickVoice(){
  if (!canSpeak) return;
  const vs = speechSynthesis.getVoices();
  const us = vs.filter(v => /^en[-_]US/i.test(v.lang));
  const en = us.length ? us : vs.filter(v => /^en/i.test(v.lang));
  voice = en.find(v => /Natural|Neural|Premium|Enhanced/i.test(v.name))
    || en.find(v => /Google US English|Samantha|Jenny|Aria|Ava|Allison|Susan|Zira/i.test(v.name)) || en[0] || null;
}
if (canSpeak) { pickVoice(); speechSynthesis.addEventListener && speechSynthesis.addEventListener('voiceschanged', pickVoice); }
function ttsSay(text, rate){
  return new Promise(res => {
    if (!canSpeak) { setTimeout(res, 600); return; }
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; if (voice) u.voice = voice;
    u.rate = rate; u.pitch = 1.05;
    u.onend = fin; u.onerror = fin;
    setTimeout(fin, 1800 + text.length * 110);
    try { speechSynthesis.speak(u); } catch (e) { fin(); }
  });
}

let voSrc = null, voSeq = 0, voChain = Promise.resolve();
function stopVoice(){
  voSeq++;
  if (voSrc) { const s = voSrc; voSrc = null; try { s.stop(); } catch (e) {} }
  if (canSpeak && (speechSynthesis.speaking || speechSynthesis.pending)) speechSynthesis.cancel();
}
async function playLine(text, my, rate){
  const c = VO[vkey(text)];
  const buf = c ? await Promise.race([loadSprite(c[0]), wait(2500)]) : null;
  if (my !== voSeq) return;
  const a = audio();
  if (!buf || !a) return ttsSay(text, rate);
  await new Promise(res => {
    const s = a.createBufferSource(); s.buffer = buf; s.connect(a.destination);
    let done = false; const fin = () => { if (!done) { done = true; if (voSrc === s) voSrc = null; res(); } };
    s.onended = fin; voSrc = s;
    s.start(0, Math.max(0, c[1] - .02), c[2] + .12);
    setTimeout(fin, (c[2] + .6) * 1000);
  });
}
// say one line or several in a row; a new call interrupts unless it asks to queue
function say(parts, { queue = false, rate = .85 } = {}){
  const list = Array.isArray(parts) ? parts : [parts];
  if (!queue) { stopVoice(); voChain = Promise.resolve(); }
  const my = voSeq;
  const run = async () => { for (let i = 0; i < list.length; i++) { if (my !== voSeq) return; if (i) await wait(140); await playLine(list[i], my, rate); } };
  return (voChain = voChain.then(run, run));
}

let ac = null;
function audio(){
  if (!ac) {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
    try { ac = new C({ sampleRate:24000 }); } catch (e) { try { ac = new C(); } catch (e2) { return null; } }
  }
  if (ac.state === 'suspended') { const pr = ac.resume(); if (pr && pr.catch) pr.catch(() => {}); }
  return ac;
}
function note(f, t, d, type = 'triangle', v = .15, f2){
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + t;
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d * .7);
  g.gain.setValueAtTime(.0001, t0);
  g.gain.exponentialRampToValueAtTime(v, t0 + .015);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0 + d + .05);
}

const fx = document.createElement('canvas'); fx.id = 'fx'; document.body.appendChild(fx);
const fctx = fx.getContext('2d');
let parts = [], raf = 0, fdpr = 1;
function sizeFx(){ fdpr = Math.min(2, window.devicePixelRatio || 1); fx.width = innerWidth * fdpr; fx.height = innerHeight * fdpr; }
sizeFx(); addEventListener('resize', sizeFx);
function burst(x, y, n){
  if (reduce) n = Math.min(n, 10);
  for (let k = 0; k < n; k++) {
    const a = Math.random() * TAU, sp = 4 + Math.random() * 9;
    parts.push({ x, y, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp - 6, r:7 + Math.random() * 9,
      rot:Math.random() * 6, vr:(Math.random() - .5) * .3, s:k % 3, c:RAINBOW[k % 7], t:0, life:70 + Math.random() * 40 });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function burstAt(el, n){ const r = el.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, n); }
function shapeOn(c, s, r){
  c.beginPath();
  if (s === 0) { for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * .45 : r, a = i * Math.PI / 5 - Math.PI / 2; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } c.closePath(); }
  else if (s === 1) { const k = r / 14; c.moveTo(0, 6 * k); c.bezierCurveTo(-14 * k, -4 * k, -6 * k, -14 * k, 0, -7 * k); c.bezierCurveTo(6 * k, -14 * k, 14 * k, -4 * k, 0, 6 * k); }
  else c.arc(0, 0, r * .5, 0, TAU);
  c.fill();
}
function tick(){
  fctx.setTransform(fdpr, 0, 0, fdpr, 0, 0);
  fctx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.t < p.life && p.y < innerHeight + 40);
  for (const p of parts) {
    p.t++; p.vy += .32; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    fctx.save(); fctx.globalAlpha = Math.min(1, (p.life - p.t) / 20);
    fctx.translate(p.x, p.y); fctx.rotate(p.rot); fctx.fillStyle = p.c; shapeOn(fctx, p.s, p.r);
    fctx.restore();
  }
  raf = parts.length ? requestAnimationFrame(tick) : 0;
}

function buildSession(wid, game){
  const pool = wid === 'mix' ? WORLDS.flatMap(W => W.words.map((_, i) => ({ w:W.id, i }))) : byId[wid].words.map((_, i) => ({ w:wid, i }));
  const isGot = p => P.got[wordOf(p.w, p.i).key];
  const words = shuffle(pool.filter(p => !isGot(p))).concat(shuffle(pool.filter(isGot))).slice(0, 5);
  return { id:Date.now(), world:wid, game, words, intro:0, stars:0, bonus:0 };
}

/* ================= canvas games ================= */
const G = { on:false };
const PAL = {
  home:{ sky:['#ffe0f1','#e4dcff'], dot:'rgba(255,255,255,.6)', ground:'#a8e9bf', ground2:'#7fd6a0', hill:'#d4f4de', cloud:'#ffffff' },

  sweets:{ sky:['#fff0d8','#ffd6e4'], dot:'rgba(255,255,255,.6)', ground:'#ffc2d6', ground2:'#ff9fbf', hill:'#ffe3b8', cloud:'#ffffff' },
  colors:{ sky:['#fff6c4','#d6efff'], dot:'rgba(255,255,255,.65)', ground:'#a7e8b0', ground2:'#7fd690', hill:'#ffe9a8', cloud:'#ffffff' },
  cars:{ sky:['#c6ebff','#e4fae2'], dot:'rgba(255,255,255,.6)', ground:'#8e93a6', ground2:'#6f7488', hill:'#bfe8b0', cloud:'#ffffff', road:true },
  halloween:{ sky:['#24133f','#56307f'], dot:'rgba(255,236,190,.3)', ground:'#3b2a55', ground2:'#2a1d40', hill:'#4a2f70', cloud:'rgba(255,255,255,.12)', moon:true },
};
const pal = () => PAL[S.ses.world] || PAL.home;
const HEART = typeof Path2D !== 'undefined' ? new Path2D(HEART_D) : null;

function drawPic(c, w, x, y, size){
  if (w.color) {
    if (!HEART) return;
    const [c1, c2] = w.pic.split(','), s = size / 100;
    c.save(); c.translate(x - 50 * s, y - 46 * s); c.scale(s, s);
    if (c2) { const g = c.createLinearGradient(0, 0, 100, 92); g.addColorStop(0, c1); g.addColorStop(.55, c2); g.addColorStop(1, c1); c.fillStyle = g; } else c.fillStyle = c1;
    c.fill(HEART); c.lineWidth = 3; c.strokeStyle = 'rgba(74,43,94,.32)'; c.stroke(HEART);
    c.restore(); return;
  }
  c.font = `${Math.round(size)}px ${EMOJI_FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#000';
  c.fillText(w.pic, x, y + size * .06);
}
const easeBack = t => { const s = 1.7; t -= 1; return 1 + t * t * ((s + 1) * t + s); };
function drawBubble(c, it, glow){
  const s = easeBack(Math.min(1, it.s == null ? 1 : it.s));
  const x = it.x, y = it.y + Math.sin(G.t * 2.2 + it.ph) * G.U * .08, r = it.r * s;
  if (r <= 1) return;
  if (glow) { const p = (Math.sin(G.t * 7) + 1) / 2; c.beginPath(); c.arc(x, y, r + G.U * .15 + p * G.U * .2, 0, TAU); c.fillStyle = `rgba(255,210,63,${.35 + .4 * p})`; c.fill(); }
  c.beginPath(); c.ellipse(x, y + r * .98, r * .7, r * .16, 0, 0, TAU); c.fillStyle = 'rgba(74,43,94,.12)'; c.fill();
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = '#fff'; c.fill();
  c.lineWidth = Math.max(3, r * .09); c.strokeStyle = RAINBOW[(it.k || 0) % 7]; c.stroke();
  drawPic(c, sw(it.j), x, y, r * 1.2);
}
function drawPop(c, it, x = it.x, y = it.y){
  const p = it.pop; if (p <= 0) return;
  c.beginPath(); c.arc(x, y, it.r * (1.5 - .5 * p), 0, TAU);
  c.lineWidth = 5 * p; c.strokeStyle = `rgba(255,255,255,${p})`; c.stroke();
}
function skyFill(c){
  const p = pal(), g = c.createLinearGradient(0, 0, 0, G.H);
  g.addColorStop(0, p.sky[0]); g.addColorStop(1, p.sky[1]);
  c.fillStyle = g; c.fillRect(0, 0, G.W, G.H);
  if (p.moon) { c.beginPath(); c.arc(G.W * .82, G.H * .16, G.U * .75, 0, TAU); c.fillStyle = '#fff3c4'; c.fill(); }
}
function dots(c){
  c.fillStyle = pal().dot;
  for (let y = 22, r = 0; y < G.H; y += 44, r++) for (let x = r % 2 ? 22 : 0; x < G.W + 22; x += 44) { c.beginPath(); c.arc(x, y, 2, 0, TAU); c.fill(); }
}
function cloudC(c, x, y, s){
  c.fillStyle = pal().cloud;
  c.beginPath(); c.arc(x, y, s * .5, 0, TAU); c.arc(x + s * .55, y - s * .25, s * .65, 0, TAU); c.arc(x + s * 1.15, y, s * .5, 0, TAU); c.fill();
  c.fillRect(x, y, s * 1.15, s * .5);
}
function pickSet(n){
  const others = shuffle(range(S.ses.words.length).filter(j => j !== G.target)).slice(0, n - 1);
  return shuffle([G.target, ...others]);
}

/* --- worm: drag to steer, eat the picture you hear --- */
function placeItem(it){
  const r = it.r, m = r + 8;
  for (let k = 0; k < 60; k++) {
    const x = m + Math.random() * (G.W - 2 * m), y = m + Math.random() * (G.H - 2 * m);
    if (G.head && Math.hypot(x - G.head.x, y - G.head.y) < G.U * 3) continue;
    if (G.items.some(o => o !== it && o.alive && o.x != null && Math.hypot(x - o.x, y - o.y) < r * 2.6)) continue;
    it.x = x; it.y = y; return;
  }
  it.x = m + Math.random() * (G.W - 2 * m); it.y = m + Math.random() * (G.H - 2 * m);
}
const worm = {
  init(){
    G.head = { x:G.W / 2, y:G.H * .62, a:-Math.PI / 2 };
    G.segs = range(5).map(i => ({ x:G.W / 2, y:G.H * .62 + (i + 1) * G.U * .5 }));
    G.aim = null; G.chomp = 0;
  },
  resize(){
    if (!G.head) return;
    G.head.x = Math.min(G.head.x, G.W - 10); G.head.y = Math.min(G.head.y, G.H - 10);
    G.items.forEach(it => { it.r = G.U * .95; if (it.x != null) { it.x = Math.min(Math.max(it.x, it.r), G.W - it.r); it.y = Math.min(Math.max(it.y, it.r), G.H - it.r); } });
  },
  round(){
    const n = G.round < 2 ? 3 : 4;
    G.items = [];
    pickSet(n).forEach((j, k) => { const it = { j, k, r:G.U * .95, s:0, alive:true, respawn:0, pop:0, ph:Math.random() * TAU }; G.items.push(it); placeItem(it); });
  },
  press(x, y){ G.aim = { x, y }; },
  update(dt){
    const U = G.U, h = G.head, sp = U * (4.2 + Math.min(1.2, (G.segs.length - 5) * .15)), turn = 5.2, R = U * .62;
    if (G.aim) {
      const ax = Math.min(Math.max(G.aim.x, R), G.W - R), ay = Math.min(Math.max(G.aim.y, R), G.H - R);
      if (Math.hypot(ax - h.x, ay - h.y) < U * .4 && !G.down) G.aim = null;
      else { let diff = Math.atan2(ay - h.y, ax - h.x) - h.a; diff = Math.atan2(Math.sin(diff), Math.cos(diff)); h.a += Math.max(-turn * dt, Math.min(turn * dt, diff)); }
    }
    h.x += Math.cos(h.a) * sp * dt; h.y += Math.sin(h.a) * sp * dt;
    if (h.x < R) { h.x = R; h.a = Math.PI - h.a; } if (h.x > G.W - R) { h.x = G.W - R; h.a = Math.PI - h.a; }
    if (h.y < R) { h.y = R; h.a = -h.a; } if (h.y > G.H - R) { h.y = G.H - R; h.a = -h.a; }
    let prev = h; const gap = U * .5;
    for (const s of G.segs) { const dx = s.x - prev.x, dy = s.y - prev.y, d = Math.hypot(dx, dy) || 1; if (d > gap) { s.x = prev.x + dx / d * gap; s.y = prev.y + dy / d * gap; } prev = s; }
    G.chomp = Math.max(0, G.chomp - dt);
    for (const it of G.items) {
      it.pop = Math.max(0, it.pop - dt * 3);
      if (it.alive) it.s = Math.min(1, it.s + dt * 3);
      else if (it.respawn > 0) { it.respawn -= dt; if (it.respawn <= 0) { placeItem(it); it.alive = true; it.s = 0; } }
      if (!it.alive || G.done || it.s < .6) continue;
      if (Math.hypot(it.x - h.x, it.y - h.y) < R + it.r * .75) {
        it.alive = false; it.pop = 1; G.chomp = .35;
        if (it.j === G.target) { const t = G.segs[G.segs.length - 1]; G.segs.push({ x:t.x, y:t.y }); gotIt(it.x, it.y); }
        else { it.respawn = 1.6; oops(it.j); }
      }
    }
  },
  draw(c){
    skyFill(c); dots(c);

/* --- jump: the princess runs, tap to jump into the right bubble --- */
const jump = {
  init(){ Object.assign(G, { py:0, vy:0, ground:true, dizzy:0, scroll:0, queue:[], spawnT:.6, buf:0, items:[] }); jump.geo(); },
  geo(){
    G.gy = G.H * .84; G.ch = Math.min(G.U * 3.2, G.H * .36); G.cw = G.ch * 2 / 3;
    G.cx = Math.max(G.W * .2, G.cw * .9); G.jh = G.ch;

    G.iy = G.gy - G.ch * .6 - G.jh * .8; G.ir = G.ch * .27; G.vx = Math.max(G.W * .22, G.U * 3);
  },
  resize(){ jump.geo(); G.items.forEach(it => { it.y = G.iy; it.r = G.ir; }); },
  round(){ G.items.forEach(it => { if (it.alive) { it.alive = false; it.pop = 1; } }); G.queue = pickSet(G.round < 2 ? 3 : 4); G.spawnT = Math.min(G.spawnT, 1); },
  press(){ if (G.ground && G.dizzy <= 0) { G.vy = G.v0; G.ground = false; sfx.jump(); } else G.buf = .18; },
  update(dt){
    G.scroll += G.vx * dt;

    if (!G.ground) { G.vy -= G.g * dt; G.py += G.vy * dt; if (G.py <= 0) { G.py = 0; G.vy = 0; G.ground = true; if (G.buf > 0) { G.buf = 0; jump.press(); } } }

  draw(c){

    for (let k = -1; k < 3; k++) { const x = k * cw - (G.scroll * .12 % cw); cloudC(c, x + cw * .2, G.H * (.14 + (k & 1) * .1), U * 1.1); }

    for (let k = -1; k < 4; k++) { const x = k * hw - (G.scroll * .35 % hw); c.beginPath(); c.ellipse(x + hw / 2, G.gy, hw * .62, G.H * .2, 0, Math.PI, 0); c.fill(); }

    c.fillStyle = p.ground2; c.fillRect(0, G.gy, G.W, U * .22);

    }
    for (const it of G.items) { if (it.alive) drawBubble(c, it, it.j === G.target && G.hint && !G.done); else drawPop(c, it); }
    const pet = P.wear.pet;

    c.beginPath(); c.ellipse(G.cx, G.gy + U * .04, G.cw * .32 * (1 - lift * .5), U * .12, 0, 0, TAU); c.fillStyle = 'rgba(0,0,0,.14)'; c.fill();
    const img = avatarImage(), bob = G.ground ? Math.abs(Math.sin(G.t * 11)) * U * .12 : 0;

/* --- balloon: pictures float up, pop the right one --- */
const bx = b => b.x0 + Math.sin(G.t * 1.1 + b.ph) * G.U * .3;
function newBalloon(j, col, n, k){
  const colW = G.W / n, rx = Math.min(G.U * .95, colW * .46), ry = rx * 1.18;
  return { j, alive:true, pop:0, wob:0, col, n, rx, ry, x0:colW * (col + .5), y:G.H + ry * 1.3 + k * G.H * .18,
    v:G.H * (.12 + Math.random() * .05), ph:Math.random() * TAU, color:S.ses.world === 'colors' ? '#efe6ff' : PASTEL[(col * 3 + k) % 7] };
}
const balloon = {
  init(){ G.items = []; },
  resize(){ G.items.forEach(b => { const colW = G.W / b.n; b.x0 = colW * (b.col + .5); b.rx = Math.min(G.U * .95, colW * .46); b.ry = b.rx * 1.18; }); },
  round(){
    G.items.forEach(b => { if (b.alive) { b.alive = false; b.pop = 1; } });
    const n = Math.min(G.round < 2 ? 4 : 5, S.ses.words.length);
    G.pool = pickSet(n);
    const cols = shuffle(range(n));
    G.pool.forEach((j, k) => G.items.push(newBalloon(j, cols[k], n, k)));
  },
  press(x, y){
    if (G.done) return;

      if (!b.alive) continue;
      const cx = bx(b), dx = (x - cx) / (b.rx * 1.2), dy = (y - b.y) / (b.ry * 1.2);
      if (dx * dx + dy * dy <= 1) {
        if (b.j === G.target) { b.alive = false; b.pop = 1; b.px = cx; sfx.pop(); gotIt(cx, b.y); }
        else { b.wob = 1; oops(b.j); }
        return;
      }
    }
  },
  update(dt){
    for (const b of G.items) {
      b.pop = Math.max(0, b.pop - dt * 3);
      if (!b.alive) continue;
      b.y -= b.v * dt; b.wob = Math.max(0, b.wob - dt * 2.5);
      if (b.y < -b.ry * 2.2) {
        if (b.j === G.target) G.hint = true;
        b.y = G.H + b.ry * 1.4;
        const hasTarget = G.items.some(o => o !== b && o.alive && o.j === G.target);
        b.j = hasTarget ? pickOne(G.pool) : G.target;
      }
    }
    G.items = G.items.filter(b => b.alive || b.pop > 0);
  },
  draw(c){
    skyFill(c); dots(c);
    const img = avatarImage(), ah = Math.min(G.H * .34, G.U * 3.2), aw = ah * 2 / 3;
    if (img.complete && img.naturalWidth) c.drawImage(img, G.U * .2, G.H - ah - Math.abs(Math.sin(G.t * 3)) * G.U * .1, aw, ah);
    for (const b of G.items) {
      if (!b.alive) { if (b.pop > 0) drawPop(c, { r:b.rx, pop:b.pop }, b.px != null ? b.px : bx(b), b.y); continue; }

      c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, TAU); c.fillStyle = b.color; c.fill(); c.lineWidth = 2; c.strokeStyle = 'rgba(74,43,94,.2)'; c.stroke();
      c.beginPath(); c.moveTo(x, y + ry - 2); c.lineTo(x - rx * .14, y + ry + rx * .2); c.lineTo(x + rx * .14, y + ry + rx * .2); c.closePath(); c.fillStyle = b.color; c.fill();

const GAME = { worm, jump, balloon };

/* --- shared game loop --- */
function sizeField(){
  if (!G.on) return;
  const r = G.field.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  if (r.width < 10 || r.height < 10) return;
  G.W = r.width; G.H = r.height; G.dpr = dpr;
  G.cv.width = Math.round(r.width * dpr); G.cv.height = Math.round(r.height * dpr);
  G.U = Math.min(G.W, G.H) / 10;
  if (G.ready) GAME[G.type].resize();
}
const pt = e => { const r = G.cv.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; };
function hideCue(){ const el = app.querySelector('.field-cue'); if (el) el.hidden = true; }
function onDown(e){
  if (!G.on) return;
  const p = pt(e); G.down = true; hideCue();
  GAME[G.type].press(p.x, p.y);
  try { G.cv.setPointerCapture(e.pointerId); } catch (_) {}
  e.preventDefault();
}
function onMove(e){ if (G.on && G.type === 'worm' && (G.down || e.pointerType === 'mouse')) G.aim = pt(e); }
function onUp(){ G.down = false; }
function onKey(e){
  if (!G.on) return;
  if (G.type === 'jump' && (e.key === ' ' || e.key === 'ArrowUp')) { jump.press(); hideCue(); e.preventDefault(); }
  if (G.type === 'worm' && e.key.startsWith('Arrow')) {
    const d = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0] }[e.key];
    if (d) { G.aim = { x:G.head.x + d[0] * G.W, y:G.head.y + d[1] * G.H }; hideCue(); e.preventDefault(); }
  }
}
function startGame(){
  const field = app.querySelector('.field'); if (!field) return;
  const cv = field.querySelector('canvas');
  Object.assign(G, { on:true, ready:false, token:{}, cv, ctx:cv.getContext('2d'), field, type:S.ses.game, t:0, round:0, items:[], done:false, hint:false, roundT:0, down:false, aim:null, head:null });
  G.targets = range(S.ses.words.length);
  G.targets = shuffle(G.targets);
  while (G.targets.length < ROUNDS) { let c; do { c = Math.floor(Math.random() * S.ses.words.length); } while (c === G.targets[G.targets.length - 1]); G.targets.push(c); }
  sizeField();
  if (window.ResizeObserver) { G.ro = new ResizeObserver(sizeField); G.ro.observe(field); }
  else { G.ro = { disconnect(){ removeEventListener('resize', sizeField); } }; addEventListener('resize', sizeField); }
  GAME[G.type].init(); G.ready = true;
  cv.addEventListener('pointerdown', onDown);
  cv.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('keydown', onKey);
  nextRound();
  G.last = performance.now();
  G.raf = requestAnimationFrame(frame);
}
function stopGame(){
  if (!G.on) return;
  G.on = false; cancelAnimationFrame(G.raf);
  if (G.ro) G.ro.disconnect();
  window.removeEventListener('pointerup', onUp);
  window.removeEventListener('keydown', onKey);
}
const promptText = () => PROMPTS[G.type].say(sw(G.target));
function hud(){
  const w = sw(G.target), el = app.querySelector('.ask-word');
  if (el) { el.textContent = w.en; el.style.fontSize = `min(38px, ${(66 / (w.en.length * .68)).toFixed(2)}vw)`; }
  app.querySelectorAll('.rdots i').forEach((d, k) => { d.className = k < G.round ? 'on' : k === G.round ? 'now' : ''; });
}
function nextRound(){
  if (!G.on) return;
  if (G.round >= G.targets.length) { finishGame(); return; }
  G.target = G.targets[G.round]; G.done = false; G.hint = false; G.roundT = 0;
  hud();
  GAME[G.type].round();
  say(promptText());
}
function gotIt(x, y){
  const w = sw(G.target);
  G.done = true; G.round++;
  S.ses.stars++; P.stars++; P.got[w.key] = 1; save();
  sfx.yay();
  const r = G.cv.getBoundingClientRect();
  burst(r.left + x, r.top + y, 60); flyStarXY(r.left + x, r.top + y);
  app.querySelectorAll('.rdots i').forEach((d, k) => { d.className = k < G.round ? 'on' : ''; });
  const tok = G.token;

}
function oops(j){

function finishGame(){

  S.screen = 'result'; render();
}
function frame(now){
  if (!G.on) return;
  const dt = Math.min(.05, (now - G.last) / 1000); G.last = now;
  if (!document.hidden && G.W) {
    G.t += dt;
    if (!G.done) { G.roundT += dt; if (!G.hint && G.roundT > 10) { G.hint = true; say(promptText()); } }
    GAME[G.type].update(dt);
    const c = G.ctx; c.setTransform(G.dpr, 0, 0, G.dpr, 0, 0); c.clearRect(0, 0, G.W, G.H);
    GAME[G.type].draw(c);
  }
  G.raf = requestAnimationFrame(frame);
}

// full screen where the browser allows it (not when already opened from the home screen)
function canFullscreen(){
  const installed = matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches || navigator.standalone;
  return !installed && !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
}

      ? (d.exitFullscreen || d.webkitExitFullscreen).call(d)

  } catch (e) {}
}
